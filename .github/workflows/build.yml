name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generate Android project boilerplate
        run: |
          flutter create --org com.kalistenia --project-name kalistenia /tmp/base
          cp -r /tmp/base/android .
          grep -r "kotlin" android/build.gradle || true
          sed -i "s/ext\.kotlin_version = ['\"][^'\"]*['\"]/ext.kotlin_version = '1.9.22'/" android/build.gradle
          grep -r "kotlin" android/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kalistenika-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
